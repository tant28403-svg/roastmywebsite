id: exposed-git-directory
info:
  name: Exposed .git Directory
  severity: high
  description: The .git directory is publicly accessible.
  tags: [exposure, git]
requests:
  - method: GET
    path:
      - "{{BaseURL}}/.git/HEAD"
    matchers:
      - type: status
        status: [200]
      - type: word
        words: ["ref:"]