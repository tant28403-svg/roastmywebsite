id: exposed-htpasswd
info:
  name: Exposed .htpasswd
  severity: high
  description: The .htpasswd file is publicly accessible, potentially exposing password hashes.
  tags: [exposure, auth, credentials]
requests:
  - method: GET
    path:
      - "{{BaseURL}}/.htpasswd"
      - "{{BaseURL}}/.htpasswds"
    matchers:
      - type: status
        status: [200]
      - type: regex
        regex: ["^[a-zA-Z0-9_\\-]+:\\$[a-z0-9$./]+" ]